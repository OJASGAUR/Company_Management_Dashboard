name: Prisma Compute Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: prisma-compute-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH_SECRET: ci-only-placeholder-secret-change-me
      NEXTAUTH_URL: https://cmszfa3dp1ksg12fapvct579j.sin.prisma.build
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Deploy to Prisma Compute
        uses: prisma/cloud-deploy-action@v1
        with:
          prisma-version: 8.0.0-rc.13
          install-command: >-
            npm install --package-lock=false --ignore-scripts &&
            npm install --no-save --package-lock=false --ignore-scripts prisma@8.0.0-rc.13
          build-command: >-
            npx --yes prisma@7.9.1 db push --accept-data-loss &&
            npm run build
